<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>合伙人服务管理台</title>
<style>
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 16px; color: #222; }
  h2 { font-size: 16px; margin: 24px 0 8px; }
  h2:first-child { margin-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { border: 1px solid #e5e5e5; padding: 6px 10px; text-align: left; }
  th { background: #fafafa; }
  button { cursor: pointer; border: 1px solid #d9d9d9; background: #fff; border-radius: 4px; padding: 3px 10px; font-size: 12px; }
  button:hover { border-color: #999; }
  button.danger { color: #cf1322; border-color: #ffa39e; }
  button.primary { color: #1677ff; border-color: #91caff; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
  .tag.active { background: #f6ffed; color: #389e0d; }
  .tag.frozen { background: #fff1f0; color: #cf1322; }
  .tag.pending { background: #fffbe6; color: #ad6800; }
  .tag.approved { background: #f6ffed; color: #389e0d; }
  .tag.rejected { background: #fff1f0; color: #cf1322; }
  #status { color: #999; font-size: 13px; }
  #app { display: none; }
</style>
</head>
<body>
  <div id="status">正在与基座握手...</div>
  <div id="app">
    <h2>合伙人列表</h2>
    <table id="partner-table">
      <thead><tr><th>合伙人编号</th><th>状态</th><th>星级</th><th>积分</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>

    <h2>外部任务审核</h2>
    <table id="task-table">
      <thead><tr><th>提交编号</th><th>任务类型</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <script src="/admin-embed.js"></script>
  <script>
    (function () {
      var statusEl = document.getElementById("status");
      var appEl = document.getElementById("app");

      function setStatus(msg) { statusEl.textContent = msg; }

      function api(path, options, token) {
        return fetch(path, Object.assign({
          headers: Object.assign({ "Content-Type": "application/json" }, token ? { Authorization: "Bearer " + token } : {}),
        }, options || {})).then(function (res) { return res.json(); });
      }

      function renderPartners(token, items) {
        var tbody = document.querySelector("#partner-table tbody");
        tbody.innerHTML = "";
        items.forEach(function (p) {
          var tr = document.createElement("tr");
          var isFrozen = p.status === "frozen" || p.status === "FROZEN";
          tr.innerHTML =
            "<td>" + p.partnerCode + "</td>" +
            "<td><span class=\"tag " + (isFrozen ? "frozen" : "active") + "\">" + p.status + "</span></td>" +
            "<td>" + p.currentStar + "</td>" +
            "<td>" + p.totalMira + "</td>" +
            "<td></td>";
          var actionTd = tr.lastElementChild;
          var btn = document.createElement("button");
          btn.className = isFrozen ? "primary" : "danger";
          btn.textContent = isFrozen ? "解冻" : "冻结";
          btn.onclick = function () {
            var action = isFrozen ? "unfreeze" : "freeze";
            var body = isFrozen ? {} : { reason: "管理台手动操作" };
            api("/biz/partner/admin/partners/" + p.partnerId + "/" + action, { method: "PUT", body: JSON.stringify(body) }, token)
              .then(function () { return loadPartners(token); });
          };
          actionTd.appendChild(btn);
          tbody.appendChild(tr);
        });
      }

      function loadPartners(token) {
        return api("/biz/partner/admin/partners?page=1&pageSize=20", {}, token).then(function (res) {
          renderPartners(token, (res.data && res.data.items) || []);
        });
      }

      function renderSubmissions(token, items) {
        var tbody = document.querySelector("#task-table tbody");
        tbody.innerHTML = "";
        items.forEach(function (s) {
          var tr = document.createElement("tr");
          var statusClass = { PENDING: "pending", APPROVED: "approved", REJECTED: "rejected" }[s.status] || "";
          tr.innerHTML =
            "<td>" + s.submissionCode + "</td>" +
            "<td>" + s.taskType + "</td>" +
            "<td><span class=\"tag " + statusClass + "\">" + s.status + "</span></td>" +
            "<td>" + new Date(s.createdAt).toLocaleString() + "</td>" +
            "<td></td>";
          var actionTd = tr.lastElementChild;
          if (s.status === "PENDING") {
            var approveBtn = document.createElement("button");
            approveBtn.className = "primary";
            approveBtn.textContent = "通过";
            approveBtn.onclick = function () {
              api("/admin/external-task/submissions/" + s.id + "/approve", { method: "POST", body: "{}" }, token)
                .then(function () { return loadSubmissions(token); });
            };
            var rejectBtn = document.createElement("button");
            rejectBtn.className = "danger";
            rejectBtn.textContent = "驳回";
            rejectBtn.style.marginLeft = "6px";
            rejectBtn.onclick = function () {
              api("/admin/external-task/submissions/" + s.id + "/reject", { method: "POST", body: JSON.stringify({ reviewRemark: "管理台手动驳回" }) }, token)
                .then(function () { return loadSubmissions(token); });
            };
            actionTd.appendChild(approveBtn);
            actionTd.appendChild(rejectBtn);
          }
          tbody.appendChild(tr);
        });
      }

      function loadSubmissions(token) {
        return api("/admin/external-task/submissions?page=1&pageSize=20", {}, token).then(function (res) {
          renderSubmissions(token, (res.data && res.data.items) || []);
        });
      }

      // baseOrigin 走 document.referrer——iframe 由基座加载时浏览器会带这个头,
      // 协议本身(EmbedFrame/@optimus/admin-embed)不接受额外改造,不能靠 query 参数传
      var baseOrigin = document.referrer ? new URL(document.referrer).origin : "";
      if (!baseOrigin) {
        setStatus("未检测到基座来源(document.referrer 为空)，本页需要在管理后台的 embed 入口里打开");
        return;
      }

      OptimusAdminEmbed.init({ baseOrigin: baseOrigin })
        .then(function (ctx) {
          var token = ctx.token;
          if (!ctx.perms || (!ctx.perms.includes("*") && !ctx.perms.includes("PartnerManagement"))) {
            setStatus("当前账号缺少 PartnerManagement 权限码，请联系管理员分配角色权限");
            return;
          }
          appEl.style.display = "block";
          statusEl.style.display = "none";
          loadPartners(token);
          loadSubmissions(token);
        })
        .catch(function (err) {
          setStatus("握手失败: " + err.message);
        });
    })();
  </script>
</body>
</html>
